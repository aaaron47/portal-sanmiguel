# Configuración del prototipo: base de datos H2 en memoria con datos de ejemplo.
# Para la BD real en la nube usa el perfil "cloud" (application-cloud.yml).
spring:
  application:
    name: portal-quejas-admin
  config:
    # Variables locales (DB_HOST, DB_USER, DB_PASSWORD...) desde un .env en la raíz, ignorado por git.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:quejas;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # Con H2, schema.sql (la secuencia seq_resolucion) corre después de que Hibernate crea las tablas.
    defer-datasource-initialization: true
    properties:
      # La BD guarda los instantes en UTC; la aplicación trabaja en la hora local del servidor.
      hibernate.jdbc.time_zone: UTC
  thymeleaf:
    cache: false
  mail:
    # Sin el perfil "smtp" apunta a un servidor local que normalmente no existe: los correos quedan como
    # "no se pudo enviar" y nunca salen a internet. Las pruebas automáticas levantan GreenMail en su lugar.
    host: localhost
    port: 1025
    properties:
      # Si el servidor de correo no contesta, no esperar más de 5 segundos.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  # Detrás de un túnel o proxy (reenvío de puertos de VS Code, balanceador) usar el host y el https
  # públicos que llegan en X-Forwarded-Host / X-Forwarded-Proto. Sin esto, los redireccionamientos
  # (por ejemplo al /login) apuntan a http://localhost:8080 y no abren en otra computadora.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m

portal:
  login:
    max-intentos: 5
    minutos-bloqueo: 15
  correo:
    remitente: ${CORREO_REMITENTE:portal@example.com}
    nombre-remitente: ${CORREO_NOMBRE_REMITENTE:Atención al cliente}
    # Si se llena, todos los correos van a esta dirección en lugar de la del cliente.
    # Sirve para probar con un servidor real sin escribirle a nadie más.
    redirigir-a: ${CORREO_REDIRIGIR_A:}
