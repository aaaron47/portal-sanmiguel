<!DOCTYPE html>
<!--
    Correo con la respuesta al cliente.
    Los clientes de correo (Gmail, Outlook) no leen hojas de estilo ni variables CSS: los estilos van en
    línea y los colores son copia de los de app.css (--fondo, --tinta, --tinta-2, --linea, --acento).
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Respuesta a su reclamo ${n.ticketCodigo}|">Respuesta a su reclamo</title>
</head>
<body style="margin:0; padding:0; background:#F2F4F6; font-family:Arial, Helvetica, sans-serif; color:#1E2A33;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F4F6;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:600px; background:#FFFFFF; border:1px solid #DCE2E7; border-radius:6px;">
                <tr>
                    <td style="border-top:4px solid #12606B; border-radius:6px 6px 0 0; padding:24px 28px 8px;">
                        <p style="margin:0 0 4px; font-size:13px; color:#56646F;"
                           th:text="|Reclamo ${n.ticketCodigo}|">Reclamo Q-2026-0001</p>
                        <h1 style="margin:0; font-size:20px; line-height:1.3; font-weight:600;"
                            th:text="${n.ticketAsunto}">Asunto del reclamo</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px 24px; font-size:15px; line-height:1.6;">
                        <p style="margin:0;"><th:block th:each="linea, it : ${lineas}"><span th:text="${linea}">Texto de la respuesta.</span><br th:unless="${it.last}"></th:block></p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px 24px; border-top:1px solid #DCE2E7; font-size:13px; line-height:1.5; color:#56646F;"
                        th:text="${pie}">Este correo es solo informativo y no recibe respuestas.</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
