<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Estado del correo que avisa al cliente de una respuesta. Necesita las variables "c" (Notificacion)
    y "ticketId". Se usa en el detalle del ticket y, mientras el correo se está enviando, js/correos.js
    lo vuelve a pedir (GET /tickets/{ticketId}/correos/{id}) para mostrar el resultado sin recargar.
-->
<div th:fragment="estado" class="correo" role="status" aria-live="polite"
     th:classappend="|correo-${#strings.toLowerCase(c.estado.name())}|"
     th:data-pendiente="${c.estado.name() == 'PENDIENTE'} ? 'true'"
     th:data-url="@{/tickets/{t}/correos/{id}(t=${ticketId}, id=${c.id})}">
    <span th:if="${c.estado.name() == 'PENDIENTE'}"
          th:text="|Enviando correo a ${c.destinatario}…|">Enviando correo...</span>
    <span th:if="${c.estado.name() == 'ENVIADO'}"
          th:text="|Correo enviado a ${c.destinatario} el ${#temporals.format(c.fechaEnvio, 'dd/MM/yyyy')} a las ${#temporals.format(c.fechaEnvio, 'HH:mm')}.|">Correo enviado.</span>
    <span th:if="${c.estado.name() == 'SIN_CORREO'}">
        No se envió correo: el cliente no tiene uno registrado. Avísale por teléfono.</span>
    <th:block th:if="${c.estado.name() == 'FALLIDO'}">
        <span th:text="|No se pudo enviar el correo a ${c.destinatario}.|">No se pudo enviar.</span>
        <form th:action="@{/tickets/{t}/correos/{id}/reenviar(t=${ticketId}, id=${c.id})}" method="post">
            <button type="submit" class="boton boton-sec boton-chico" data-track="reenviar-correo">Reenviar correo</button>
        </form>
    </th:block>
</div>
</body>
</html>
