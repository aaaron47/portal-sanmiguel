name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npx tsc --noEmit

      - name: Compilar
        run: npm run build

      # Lint: se agrega cuando se corrijan los 6 errores que vienen de antes (ver CLAUDE.md, sección 9);
      # hoy haría fallar todo PR. Paso a agregar: `- run: npm run lint`
      # El despliegue se agrega aquí cuando se defina el proveedor. La URL del backend
      # (NEXT_PUBLIC_API_URL) debe venir de GitHub Secrets o variables del repositorio.
