name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B verify

      # El despliegue se agrega aquí cuando definan el proveedor (AWS, Azure, GCP...).
      # Las credenciales de la BD deben venir de GitHub Secrets: DB_URL, DB_USER, DB_PASSWORD.
